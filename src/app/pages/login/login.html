<div class="login-container">
  <h1>Iniciar Sesión</h1>

  <form>
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" [(ngModel)]="usuario" name="usuario" />
    </div>

    <div class="form-group">
      <label for="contrasena">Contraseña</label>
      <input id="contrasena" type="password" [(ngModel)]="contrasena" name="contrasena" />
    </div>

    @if (errorLogin()) {
      <p class="error">{{ errorLogin() }}</p>
    }

    <button type="button" (click)="login()">Entrar</button>
  </form>

  <div class="credenciales-demo">
    <p><strong>Credenciales de prueba:</strong></p>
    <p>Usuario: empleado_demo</p>
    <p>Contraseña: Demo1234</p>
  </div>
</div>
