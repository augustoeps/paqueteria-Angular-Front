<div class="tarifa-container">
  <h1>Cotizar Envío</h1>

  <form>
    <div class="form-group">
      <label for="origen">Provincia Origen</label>
      <select id="origen" [(ngModel)]="provinciaOrigenSeleccionada" name="origen">
        <option value="" disabled selected>Selecciona una provincia</option>
        @for (provincia of provincias(); track provincia.id) {
          <option [value]="provincia.id">{{ provincia.nombre }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="destino">Provincia Destino</label>
      <select id="destino" [(ngModel)]="provinciaDestinoSeleccionada" name="destino">
        <option value="" disabled selected>Selecciona una provincia</option>
        @for (provincia of provincias(); track provincia.id) {
          <option [value]="provincia.id">{{ provincia.nombre }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="peso">Peso (kg)</label>
      <input id="peso" type="number" [(ngModel)]="pesoIngresado" name="peso" min="0.1" step="0.1" />
    </div>

    <button type="button" (click)="cotizar(provinciaOrigenSeleccionada(), provinciaDestinoSeleccionada(), pesoIngresado()!)">
      Cotizar
    </button>
  </form>

  @if (precioCotizado() !== -1) {
    <div class="resultado">
      <p>Precio estimado: <strong>{{ precioCotizado() }} €</strong></p>
    </div>
  }
</div>
